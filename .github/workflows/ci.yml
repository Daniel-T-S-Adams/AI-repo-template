# CI — runs the check command on every push and pull request.
#
# There is no stack-specific configuration here on purpose. `make check` is
# the single contract (CLAUDE.md rule 4, docs/INTAKE.md slot 5); what it runs
# is defined once, in the Makefile, so the same command works locally and in
# CI. A project that needs a toolchain installs it in the "Set up toolchain"
# step below and leaves the rest alone.
#
# NO paths-ignore: this job is a REQUIRED status check on the default branch.
# A required check that gets path-filtered never reports on a docs-only PR,
# and protection then blocks that merge forever — the classic GitHub footgun.
# If a step becomes expensive, keep the job running and skip the STEP
# conditionally instead of filtering the workflow.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # SHA-pinned, not tagged: a moved tag upstream cannot change what runs
      # here. Dependabot updates the pins (ADR 001).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # «slot: install the project's toolchain. Pin the version — a floating
      # toolchain makes a green run unreproducible. Examples:
      #   - uses: actions/setup-node@<sha> # vN
      #     with: { node-version-file: .nvmrc, cache: npm }
      #   - uses: actions/setup-python@<sha> # vN
      #     with: { python-version-file: .python-version }
      #   - run: rustup show   # reads rust-toolchain.toml
      # Delete this comment once filled. »

      # «slot: install dependencies from the lockfile, e.g. `npm ci`. »

      - name: Run check
        run: |
          if [ "$GITHUB_REPOSITORY" = "Daniel-T-S-Adams/AI-repo-template" ]; then
            # The source template has no project to check. Its equivalent gate
            # is the template self-test suite; validate-template.yml carries
            # the rest. A derived repository never takes this branch.
            echo "Source template: running template self-tests instead of make check."
            bash scripts/test-template.sh --local-only
          else
            make check
          fi
